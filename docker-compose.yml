services:
  postgres:
    image: postgres:16-alpine
    container_name: ponto-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ponto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ponto_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ponto-web
    restart: always
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: "${SESSION_SECRET}"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/ponto_db"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: ponto_postgres_data
